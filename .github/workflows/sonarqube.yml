name: SonarQube Analysis

on:
  push:
    branches:
      - feature/code-optimization
  pull_request:
    branches:
      - develop
jobs:
  sonarQube:
    name: Analyze with SonarQube
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm install
      - name: Checking Code Quality
        run: npm run quality
      - name: Run test coverage
        run: npm run test
      - name: Debug secrets
        run: |
          echo "SONAR_PROJECT_KEY=${{ secrets.SONAR_PROJECT_KEY }}"
          echo "SONAR_PROJECT_NAME=${{ secrets.SONAR_PROJECT_NAME }}"
          echo "SONAR_ORGANIZATION=${{ secrets.SONAR_ORGANIZATION }}"
          echo "SONAR_BRANCH_NAME=${{ secrets.SONAR_BRANCH_NAME }}"
      - name: Run SonarQube Scanner
        run: |
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.branch.name=develop \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
      - name: SonarQube coverage Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
